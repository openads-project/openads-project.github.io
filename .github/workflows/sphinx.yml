name: Build and Deploy Sphinx Documentation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Checkout openadstack repository
        uses: actions/checkout@v4
        with:
          repository: openads-project/openadstack
          path: _openadstack_tmp
          token: ${{ secrets.OPENADS_REPO_READ_TOKEN != '' && secrets.OPENADS_REPO_READ_TOKEN || github.token }}
          lfs: true
          ref: image-test  # TODO: change to main

      # - name: Copy openadstack docs into build tree
      #   run: |
      #     cp -r _openadstack_tmp/docs/. docs/openadstack/

      # - name: Checkout openadsim repository
      #   uses: actions/checkout@v4
      #   with:
      #     repository: openads-project/openadsim
      #     path: _openadsim_tmp
      #     token: ${{ secrets.OPENADS_REPO_READ_TOKEN != '' && secrets.OPENADS_REPO_READ_TOKEN || github.token }}
      #     lfs: true

      # - name: Copy openadsim docs into build tree
      #   run: |
      #     cp -r _openadsim_tmp/docs/. docs/openadsim/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.OPENADS_REPO_READ_TOKEN != '' && secrets.OPENADS_REPO_READ_TOKEN || github.token }}

      # TODO: Change to openadsim compose file once available
      - name: Inject calculated disk sizes into docs
        run: |
          bash docs/assets/inject_disk_sizes.sh docs/start/start.md _openadstack_tmp/docker-compose.yml _openadstack_tmp/docker-compose.yml

      - name: Build Sphinx documentation
        run: |
          cd docs
          sphinx-build -b html . _build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
