<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-labelledby="title desc">
  <title id="title">OpenADS ecosystem tutorial diagram</title>
  <desc id="desc">Diagram of OpenADS with OpenADServices, OpenADStack, OpenADSim, OpenADSuite, benchmarking, and the tutorial workflow.</desc>
  <defs>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5,1.5 L6.5,4 L1.5,6.5 Z" fill="#2563eb"/>
    </marker>
    <style>
      .label { font: 800 18px Inter, Segoe UI, Arial, sans-serif; fill: #111827; }
      .small { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #5b6472; }
      .badge { font: 800 13px Inter, Segoe UI, Arial, sans-serif; fill: #1d4ed8; letter-spacing: .04em; }
      .bartext { font: 800 16px Inter, Segoe UI, Arial, sans-serif; fill: #111827; }
      .openad { fill: #111827; font-weight: 900; }
      .variant { fill: #4b5563; font-weight: 800; }
      .step { font: 800 15px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="960" height="448" rx="16" fill="#f7f8f5"/>
  <rect x="28" y="28" width="904" height="392" rx="10" fill="#ffffff" stroke="#cfd8cf" stroke-width="2"/>
  <text class="badge" x="52" y="61" style="white-space: pre;">OpenADS Ecosystem</text>
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(64 96)">
      <rect width="218" height="244" rx="8" fill="#ffffff" stroke="#d9dee8"/>
      <path d="M0 8 Q0 0 8 0 H210 Q218 0 218 8 V44 H0 Z" fill="#edf3ff"/>
      <text class="bartext" x="18" y="29" style="white-space: pre;"><tspan class="openad">OpenAD</tspan><tspan class="variant">Services</tspan></text>
      <text class="small" x="18" y="68" style="white-space: pre;">Functional AD modules</text>
      <rect x="18" y="92" width="182" height="32" rx="7" fill="#f2f5f8" stroke="#d9dee8"/>
      <text class="small" x="34" y="113" style="white-space: pre;">Perception</text>
      <rect x="18" y="140" width="182" height="32" rx="7" fill="#f2f5f8" stroke="#d9dee8"/>
      <text class="small" x="34" y="161" style="white-space: pre;">Planning</text>
      <rect x="18" y="188" width="182" height="32" rx="7" fill="#f2f5f8" stroke="#d9dee8"/>
      <text class="small" x="34" y="209" style="white-space: pre;">Control</text>
    </g>
    <g transform="translate(374 88)">
      <rect width="230" height="168" rx="8" fill="#ffffff" stroke="#d9dee8"/>
      <path d="M0 8 Q0 0 8 0 H222 Q230 0 230 8 V44 H0 Z" fill="#e8f1ee"/>
      <text class="bartext" x="18" y="29" style="white-space: pre;"><tspan class="openad">OpenAD</tspan><tspan class="variant">Stack</tspan></text>
      <text class="small" x="18" y="68" style="white-space: pre;">Full Reference AD Stack</text>
      <rect x="18" y="92" width="194" height="28" rx="7" fill="#f2f5f8" stroke="#d9dee8"/>
      <text class="small" x="32" y="111" style="white-space: pre;">Stable Interfaces</text>
      <rect x="18" y="128" width="194" height="28" rx="7" fill="#f2f5f8" stroke="#d9dee8"/>
      <text class="small" x="32" y="147" style="white-space: pre;">Integration Baseline</text>
    </g>
    <g transform="translate(694 110)">
      <rect width="190" height="96" rx="8" fill="#ffffff" stroke="#d9dee8"/>
      <path d="M0 8 Q0 0 8 0 H182 Q190 0 190 8 V40 H0 Z" fill="#fff3dc"/>
      <text class="bartext" x="18" y="27" style="white-space: pre;"><tspan class="openad">OpenAD</tspan><tspan class="variant">Sim</tspan></text>
      <text class="small" x="18" y="64" style="white-space: pre;">Scenario-based Testing</text>
      <text class="small" x="18" y="84" style="white-space: pre;">Scalable Execution</text>
    </g>
    <g transform="translate(374 284)">
      <rect width="190" height="116" rx="8" fill="#ffffff" stroke="#d9dee8"/>
      <path d="M0 8 Q0 0 8 0 H182 Q190 0 190 8 V40 H0 Z" fill="#f9e8e6"/>
      <text class="bartext" x="18" y="27" style="white-space: pre;"><tspan class="openad">OpenAD</tspan><tspan class="variant">Suite</tspan></text>
      <text class="small" x="18" y="64" style="white-space: pre;">Development Tools</text>
      <text class="small" x="18" y="86" style="white-space: pre;">Templates, DevOps, CI/CD</text>
    </g>
    <g transform="translate(694 286)">
      <rect width="190" height="96" rx="8" fill="#ffffff" stroke="#d9dee8"/>
      <path d="M0 8 Q0 0 8 0 H182 Q190 0 190 8 V40 H0 Z" fill="#edf3ff"/>
      <text class="small" x="18" y="64" style="white-space: pre;">Verification &amp; Validation</text>
      <text class="small" x="18" y="84" style="white-space: pre;">Transparent Benchmarks</text>
      <text class="bartext" x="16.153" y="26.401" style="white-space: pre; stroke-width: 1px;"><tspan class="openad" style="word-spacing: 0px; stroke-width: 1px;">OpenAD</tspan><tspan class="variant" style="word-spacing: 0px; stroke-width: 1px;">Safety</tspan></text>
    </g>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)">
    <path d="M292 186 H364"/>
    <path d="M614 158 H684"/>
    <path d="M364 312 H292"/>
    <path d="M574 338 H684"/>
    <path d="M789 216 V276"/>
  </g>
</svg>
